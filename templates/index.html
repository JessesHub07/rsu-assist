<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>RSU Assist</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell" id="appShell">
    {% include "_sidebar.html" %}

    <div class="chat-app">
      <header class="chat-header">
        <button class="collapse-toggle" id="collapseToggle" type="button" aria-label="Collapse sidebar">&#9666;</button>
        <div class="avatar">RSU</div>
        <div class="header-text">
          <div class="title" id="headerTitle">RSU Assist</div>
          <div class="subtitle" id="headerSubtitle">AI Academic Assistant · Rivers State University</div>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button">Dark Mode</button>
      </header>

      <div id="toast" class="toast" hidden></div>

      <div class="chat-body">
        <div id="emptyState" class="empty-state">
          <div class="empty-state-inner">
            <h1 id="greetingHeading">Hi there</h1>
            <p id="greetingSubtext">What would you like to know today?</p>
            <div class="suggested-chips" id="suggestedChips"></div>
          </div>
        </div>

        <div id="messages" class="messages" hidden></div>
      </div>

      <div class="attachment-preview" id="attachmentPreview" hidden>
        <span class="attachment-chip">
          <span id="attachmentName"></span>
          <button type="button" id="attachmentRemove" aria-label="Remove attachment">&times;</button>
        </span>
      </div>

      <form id="chatForm" class="input-row">
        <label class="attach-btn" aria-label="Attach an image or PDF">
          &#128206;
          <input id="attachmentInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf" hidden>
        </label>
        <textarea id="messageInput" placeholder="Ask me anything..." autocomplete="off" rows="1"></textarea>
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='sidebar.js') }}"></script>
  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
