<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Projects - RSU Assist</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='projects.css') }}">
</head>
<body>
  <div class="app-shell" id="appShell">
    {% include "_sidebar.html" %}

    <div class="chat-app">
      <header class="chat-header">
        <div class="header-left">
          <button class="collapse-toggle" id="collapseToggle" type="button" aria-label="Collapse sidebar">&#9666;</button>
          <span class="header-title-pill">RSU Assist</span>
        </div>
        <img src="{{ url_for('static', filename='rsu-logo-2.png') }}" alt="RSU crest" class="header-logo">
      </header>

      <div id="toast" class="toast" hidden></div>

      <div class="projects-body">
        <div class="projects-top">
          <div>
            <h1 class="projects-heading">Projects</h1>
            <p class="projects-subheading">Organise chats and files by project.</p>
          </div>
          <button type="button" class="projects-new-btn" id="newProjectBtn">+ New Project</button>
        </div>

        <div class="projects-grid" id="projectsGrid"></div>

        <p class="projects-empty" id="projectsEmpty" hidden>
          No projects yet. Create one to keep a chat and its documents together.
        </p>
      </div>
    </div>
  </div>

  <div class="project-modal-backdrop" id="projectModalBackdrop" hidden>
    <div class="project-modal">
      <h2 id="projectModalTitle">New Project</h2>
      <form id="projectForm">
        <label class="settings-field">
          <span>Name</span>
          <input type="text" id="projectName" placeholder="e.g. Smart Traffic Control System" autocomplete="off">
        </label>
        <label class="settings-field">
          <span>Description</span>
          <textarea id="projectDescription" rows="3" placeholder="What's this project about?"></textarea>
        </label>
        <label class="settings-field">
          <span>Status</span>
          <select id="projectStatus">
            <option value="Planning">Planning</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </label>
        <label class="settings-field">
          <span>Tags</span>
          <input type="text" id="projectTags" placeholder="e.g. IoT, Python, Final Year" autocomplete="off">
        </label>
        <p class="project-modal-error" id="projectModalError" hidden></p>
        <div class="project-modal-actions">
          <button type="button" class="project-modal-cancel" id="projectModalCancel">Cancel</button>
          <button type="submit" class="project-modal-save" id="projectModalSave">Create Project</button>
        </div>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='sidebar.js') }}"></script>
  <script src="{{ url_for('static', filename='projects.js') }}"></script>
</body>
</html>
