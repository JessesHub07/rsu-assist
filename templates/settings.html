<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Settings - RSU Assist</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='settings.css') }}">
</head>
<body>
  <div class="app-shell" id="appShell">
    {% include "_sidebar.html" %}

    <div class="chat-app">
      <header class="chat-header">
        <div class="header-left">
          <button class="collapse-toggle" id="collapseToggle" type="button" aria-label="Collapse sidebar">&#9666;</button>
          <span class="header-title-pill">RSU Assist</span>
        </div>
        <img src="{{ url_for('static', filename='rsu-logo-2.png') }}" alt="RSU crest" class="header-logo">
      </header>

      <div id="toast" class="toast" hidden></div>

      <div class="settings-body">
        <h1 class="settings-heading">Settings</h1>

        <div class="settings-section">
          <h2>Theme</h2>
          <p class="settings-section-desc">Choose how RSU Assist looks on this device.</p>
          <div class="theme-options" id="themeOptions">
            <button type="button" class="theme-option" data-theme="light">
              <span class="theme-swatch theme-swatch-light" aria-hidden="true"></span>
              Light
            </button>
            <button type="button" class="theme-option" data-theme="dark">
              <span class="theme-swatch theme-swatch-dark" aria-hidden="true"></span>
              Dark
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='sidebar.js') }}"></script>
  <script src="{{ url_for('static', filename='settings.js') }}"></script>
</body>
</html>
