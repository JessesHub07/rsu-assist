<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#0f6b3c">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
<title>RSU Assist — Sign In</title>
<link rel="stylesheet" href="{{ url_for('static', filename='signin.css') }}">
</head>
<body>
  <div class="page">
    <aside class="brand-pane">
      <div class="dot-grid"></div>

      <div class="brand-content">
        <div class="logo-card">
          <img src="{{ url_for('static', filename='rsu-logo-2.png') }}" alt="Rivers State University crest" class="crest">
        </div>
        <h1>RSU Assist</h1>
        <p class="tagline">Your AI academic companion</p>
      </div>

      <div class="guest-prompt">
        <p class="guest-heading">Not a student?</p>
        <a href="/auth/google" class="guest-btn guest-btn-primary">
          <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
          </svg>
          Sign in with Google
        </a>
        <a href="/chat-ui" class="guest-btn guest-btn-secondary">Browse as guest &rarr;</a>
      </div>

      <div class="brand-footer">&copy; Rivers State University</div>
    </aside>

    <main class="form-pane">
      <button id="themeToggle" class="theme-toggle" type="button">Dark Mode</button>

      <div class="form-card">
        <div class="tab-pills" role="tablist">
          <button type="button" class="tab-btn active" id="tabSignin" role="tab" aria-selected="true">Sign in</button>
          <button type="button" class="tab-btn" id="tabSignup" role="tab" aria-selected="false">Sign up</button>
        </div>

        <p class="form-error" id="formError" hidden></p>

        <form id="signinForm">
          <label class="field">
            <span>Full name</span>
            <input type="text" id="signinFullName" placeholder="e.g. Chukwuemeka Obi" autocomplete="name">
          </label>
          <label class="field">
            <span>Matric number or email</span>
            <input type="text" id="identifier" placeholder="De.2022/1234" autocomplete="username">
          </label>
          <label class="field password-field">
            <span>Password</span>
            <div class="password-wrap">
              <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
              <button type="button" class="toggle-password" data-target="password" aria-label="Show password"></button>
            </div>
          </label>
          <div class="form-row">
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <button type="submit" class="submit-btn" id="signinSubmit">Sign in</button>
        </form>

        <form id="signupForm" hidden>
          <label class="field">
            <span>Full name</span>
            <input type="text" id="signupFullName" placeholder="e.g. Chukwuemeka Obi" autocomplete="name">
          </label>
          <label class="field">
            <span>Matric number</span>
            <input type="text" id="signupMatric" placeholder="De.2022/1234" autocomplete="username">
          </label>
          <p class="field-hint">Both must already be on record with your department.</p>
          <label class="field password-field">
            <span>Create password</span>
            <div class="password-wrap">
              <input type="password" id="signupPassword" placeholder="At least 8 characters" autocomplete="new-password">
              <button type="button" class="toggle-password" data-target="signupPassword" aria-label="Show password"></button>
            </div>
          </label>
          <label class="field password-field">
            <span>Confirm password</span>
            <div class="password-wrap">
              <input type="password" id="signupConfirm" placeholder="Re-enter your password" autocomplete="new-password">
              <button type="button" class="toggle-password" data-target="signupConfirm" aria-label="Show password"></button>
            </div>
          </label>
          <button type="submit" class="submit-btn" id="signupSubmit">Sign up</button>
        </form>

        <p class="switch-line">
          <span id="switchPrompt">Don't have an account?</span> <a href="#" id="switchLink">Sign up</a>
        </p>

        <p class="mobile-only">
          Not a student? <a href="/auth/google">Sign in with Google</a> or <a href="/chat-ui">browse as guest</a>.
        </p>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='signin.js') }}"></script>
  <script src="{{ url_for('static', filename='pwa.js') }}"></script>
</body>
</html>
