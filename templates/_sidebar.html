<button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle menu">&#9776;</button>
<div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="{{ url_for('static', filename='rsu-logo-2.png') }}" alt="RSU crest" class="sidebar-logo">
    <div>
      <div class="sidebar-title">RSU Assist</div>
      <div class="sidebar-dept" id="sidebarDept">Rivers State University</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="/home-ui" class="nav-item {{ 'active' if active == 'home' else '' }}">Home</a>
    <a href="/chat-ui" class="nav-item {{ 'active' if active == 'chat' else '' }}">Chat</a>

    <button type="button" class="nav-item nav-expandable" id="historyToggle">
      Chat History
      <span class="chevron" id="historyChevron">&#9662;</span>
    </button>
    <div class="history-panel" id="historyPanel" hidden>
      <p class="history-empty" id="historyEmpty">No past conversations yet.</p>
      <div id="historyList"></div>
    </div>

    <button type="button" class="nav-item nav-soon" data-label="Projects">Projects</button>
    <a href="/documents-ui" class="nav-item {{ 'active' if active == 'documents' else '' }}">My Documents</a>
    <button type="button" class="nav-item nav-soon" data-label="Bookmarks">Bookmarks</button>
    <a href="/faqs-ui" class="nav-item {{ 'active' if active == 'faqs' else '' }}">FAQs</a>
    <button type="button" class="nav-item nav-soon" data-label="Settings">Settings</button>
  </nav>

  <div class="sidebar-footer" id="sidebarFooter" hidden>
    <div class="level-badge" id="levelBadge"></div>
    <div class="user-row">
      <div class="user-avatar" id="userAvatar"></div>
      <div class="user-info">
        <div class="user-name" id="userName"></div>
        <button type="button" class="signout-btn" id="signoutBtn">Sign out</button>
      </div>
    </div>
  </div>
</aside>
